<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>City Legacy Bank - Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #f8f6f1;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    }

    .preload-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 100dvh;
      margin: 0 auto;
      background: #f8f6f1 url('bg.jpg') no-repeat center top;
      background-size: 100% auto;
      overflow: hidden;
    }

    /* Fallback if image aspect doesn't match */
    @media (min-aspect-ratio: 844/1500) {
      .preload-container {
        background-size: auto 100%;
      }
    }

    /* Logo Section */
    .logo-wrapper {
      position: absolute;
      top: 6.5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      width: 80%;
    }

    .logo-icon {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      width: 58px;
      height: 58px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(-120px);
      animation: logoFall 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    .logo-icon .sq {
      border-radius: 9px;
      background: linear-gradient(145deg, #f0c14b 0%, #e0a825 45%, #c48a0a 100%);
      box-shadow: 
        inset 0 1px 0 rgba(255,255,255,0.35),
        0 2px 4px rgba(180,120,0,0.25);
    }

    .logo-icon .sq:nth-child(1) { animation: sqIn 0.5s ease 0.4s both; }
    .logo-icon .sq:nth-child(2) { animation: sqIn 0.5s ease 0.55s both; }
    .logo-icon .sq:nth-child(3) { animation: sqIn 0.5s ease 0.7s both; }
    .logo-icon .sq:nth-child(4) { animation: sqIn 0.5s ease 0.85s both; }

    @keyframes logoFall {
      0% {
        opacity: 0;
        transform: translateY(-120px) scale(0.8);
      }
      60% {
        opacity: 1;
        transform: translateY(8px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes sqIn {
      from {
        opacity: 0;
        transform: scale(0.3);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .logo-text .city,
    .logo-text .legacy {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: clamp(26px, 7vw, 34px);
      letter-spacing: 1.5px;
      color: #0a2a5e;
      text-transform: uppercase;
    }

    .logo-text .city {
      opacity: 0;
      transform: translateX(-80px);
      animation: slideFromLeft 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards;
    }

    .logo-text .legacy {
      opacity: 0;
      transform: translateX(80px);
      animation: slideFromRight 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
    }

    .logo-text .bank {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: clamp(13px, 3.5vw, 16px);
      letter-spacing: 6px;
      color: #c9a227;
      margin-top: 6px;
      opacity: 0;
      transform: translateY(30px);
      animation: slideFromBottom 1s cubic-bezier(0.22, 1, 0.36, 1) 1.4s forwards;
    }

    @keyframes slideFromLeft {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideFromRight {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideFromBottom {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Gold underline under CITY LEGACY like in original */
    .logo-underline {
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a227, transparent);
      margin-top: 4px;
      animation: underlineGrow 0.8s ease 1.8s forwards;
    }

    @keyframes underlineGrow {
      to { width: 140px; }
    }

    /* Phone screen overlay for spinner + texts */
    .phone-screen {
      position: absolute;
      /* Phone screen area relative to 844×1500 source image */
      left: 51.5%;
      top: 23.8%;
      width: 34%;
      height: 54%;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      overflow: hidden;
    }

    /* Spinner */
    .spinner {
      width: 54px;
      height: 54px;
      border: 3.5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #c9a227;
      border-right-color: rgba(201, 162, 39, 0.45);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 28px;
      box-shadow: 0 0 18px rgba(201, 162, 39, 0.25);
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Text phases */
    .phase-texts {
      position: relative;
      width: 90%;
      height: 110px;
      text-align: center;
    }

    .phase {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }

    .phase.active {
      opacity: 1;
      transform: translateY(0);
    }

    .phase span {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: clamp(11px, 2.8vw, 13.5px);
      letter-spacing: 1.2px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      line-height: 1.3;
    }

    .phase span.highlight {
      color: #f0c14b;
      font-weight: 700;
    }

    /* Progress bar at very bottom of phone screen */
    .progress-track {
      position: absolute;
      bottom: 18px;
      left: 15%;
      width: 70%;
      height: 3px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c9a227, #f0c14b);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    /* Subtle loading label */
    .loading-label {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
      text-transform: uppercase;
    }

    /* Fade out everything at end */
    .preload-container.fade-out {
      animation: fadeOut 0.4s ease forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(1.02);
      }
    }

    /* Responsive tweaks for very small screens */
    @media (max-width: 360px) {
      .logo-icon {
        width: 48px;
        height: 48px;
        gap: 4px;
      }
      .phone-screen {
        border-radius: 22px;
      }
    }

    /* Ensure full coverage on tall phones */
    @media (min-height: 900px) {
      .preload-container {
        background-size: 100% auto;
      }
    }
  </style>
</head>
<body>
  <div class="preload-container" id="preload">
    <!-- Animated Logo -->
    <div class="logo-wrapper">
      <div class="logo-icon">
        <div class="sq"></div>
        <div class="sq"></div>
        <div class="sq"></div>
        <div class="sq"></div>
      </div>
      <div class="logo-text">
        <div class="city">CITY</div>
        <div class="legacy">LEGACY</div>
        <div class="logo-underline"></div>
        <div class="bank">BANK</div>
      </div>
    </div>

    <!-- Overlay on phone screen -->
    <div class="phone-screen">
      <div class="spinner" id="spinner"></div>
      
      <div class="phase-texts">
        <!-- Phase 1: 0-5s -->
        <div class="phase active" id="phase1">
          <span>PERSONAL ACCOUNT</span>
          <span>PRIVATE ACCOUNT</span>
          <span class="highlight">BUSINESS ACCOUNT</span>
        </div>
        <!-- Phase 2: 5-10s -->
        <div class="phase" id="phase2">
          <span>BANKING WITH LEGACY</span>
          <span class="highlight">BUILD YOUR FUTURE</span>
          <span>GAIN FINANCIAL FREEDOM</span>
        </div>
        <!-- Phase 3: 10-15s -->
        <div class="phase" id="phase3">
          <span>SAVING</span>
          <span class="highlight">LOANS</span>
          <span>INVESTMENT</span>
        </div>
      </div>

      <div class="loading-label">Loading secure session</div>
      <div class="progress-track">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const TOTAL_MS = 15000;
      const PHASE_MS = 5000;
      const progress = document.getElementById('progress');
      const phases = [
        document.getElementById('phase1'),
        document.getElementById('phase2'),
        document.getElementById('phase3')
      ];
      const container = document.getElementById('preload');
      let start = performance.now();
      let currentPhase = 0;

      function setPhase(idx) {
        phases.forEach((p, i) => {
          if (i === idx) {
            p.classList.add('active');
          } else {
            p.classList.remove('active');
          }
        });
        currentPhase = idx;
      }

      function tick(now) {
        const elapsed = now - start;
        const pct = Math.min(100, (elapsed / TOTAL_MS) * 100);
        progress.style.width = pct + '%';

        // Phase switching
        if (elapsed >= PHASE_MS * 2 && currentPhase !== 2) {
          setPhase(2);
        } else if (elapsed >= PHASE_MS && currentPhase !== 1) {
          setPhase(1);
        }

        if (elapsed < TOTAL_MS) {
          requestAnimationFrame(tick);
        } else {
          // Finish
          container.classList.add('fade-out');
          setTimeout(() => {
            // Use replace so back button does not return to preload
            window.location.replace('main.html');
          }, 380);
        }
      }

      // Start after a tiny delay so animations begin cleanly
      requestAnimationFrame(() => {
        start = performance.now();
        requestAnimationFrame(tick);
      });

      // Safety: force redirect if something stalls
      setTimeout(() => {
        if (!container.classList.contains('fade-out')) {
          window.location.replace('main.html');
        }
      }, TOTAL_MS + 800);
    })();
  </script>
</body>
</html>
